<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Tokyo Weather</title>
  <meta name="description" content="Live weather conditions and 5-day forecast for Tokyo, Japan. Updated every hour with current temperature, humidity, wind, and more." />
  <meta name="keywords" content="Tokyo weather, Japan weather, 東京天気, Tokyo forecast, live weather" />
  <meta name="author" content="Tokyo Weather" />
  <link rel="canonical" href="https://mattappsaibagus-wq.github.io/tokyo-weather/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mattappsaibagus-wq.github.io/tokyo-weather/" />
  <meta property="og:title" content="Tokyo Weather" />
  <meta property="og:description" content="Live weather conditions and 5-day forecast for Tokyo, Japan." />
  <meta property="og:image" content="https://mattappsaibagus-wq.github.io/tokyo-weather/icons/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tokyo Weather" />
  <meta name="twitter:description" content="Live weather conditions and 5-day forecast for Tokyo, Japan." />
  <meta name="twitter:image" content="https://mattappsaibagus-wq.github.io/tokyo-weather/icons/og-image.png" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#080b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tokyo Weather" />

  <!-- Favicon (inline SVG as data URI for zero extra requests) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080b14'/%3E%3Ctext y='24' x='3' font-size='22'%3E🌤%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600;700&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --glass: rgba(255,255,255,0.07);
      --glass-hover: rgba(255,255,255,0.13);
      --border: rgba(255,255,255,0.12);
      --text: #fbfbfd;
      --muted: rgba(228,232,244,0.68);
      --dim: rgba(220,225,240,0.42);
      --accent: #f5c66f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080b14;
      color: var(--text);
      overflow-x: hidden;
      overflow-y: auto;
      padding: 48px 20px;
    }

    /* noise grain overlay */
    body::after {
      content: "";
      position: fixed; inset: 0; z-index: 9999;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 128px;
    }

    /* ── Background ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      transition: background 2s ease;
    }
    .bg.clear-day   { background: linear-gradient(160deg, #0c1e3d 0%, #163a6d 40%, #2a5a8a 70%, #c47a2a 100%); }
    .bg.clear-night { background: linear-gradient(160deg, #04060e 0%, #0a1228 50%, #121838 100%); }
    .bg.cloudy      { background: linear-gradient(160deg, #10141e 0%, #1a2030 50%, #2a3448 100%); }
    .bg.rainy       { background: linear-gradient(160deg, #080c18 0%, #101830 50%, #1a2850 100%); }
    .bg.snowy       { background: linear-gradient(160deg, #101420 0%, #2a3450 50%, #6a8aaa 100%); }

    .glow {
      position: fixed; z-index: 0; pointer-events: none;
      width: 500px; height: 500px; border-radius: 50%;
      filter: blur(100px); opacity: 0.2;
      transition: opacity 2s, background 2s;
    }
    .glow.clear-day   { background: #d4843a; top: -180px; right: -120px; }
    .glow.clear-night { background: #2a3a9a; bottom: -160px; left: -160px; }
    .glow.cloudy      { background: #3a4a6a; top: 30%; left: 40%; }
    .glow.rainy       { background: #1a2a8a; bottom: -100px; right: -100px; }
    .glow.snowy       { background: #7a9aba; top: -80px; left: 20%; }

    /* ── Stars ── */
    .stars {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; opacity: 0; transition: opacity 1.5s ease;
    }
    .stars.visible { opacity: 1; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle 4s infinite alternate ease-in-out;
    }
    @keyframes twinkle { from { opacity: 0.1; } to { opacity: 0.85; } }

    /* ── Rain ── */
    .rain-container {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; overflow: hidden; opacity: 0; transition: opacity 1s;
    }
    .rain-container.visible { opacity: 1; }
    .raindrop {
      position: absolute; top: -20px; width: 1px; height: 24px;
      background: linear-gradient(to bottom, transparent, rgba(160,200,240,0.45));
      animation: fall linear infinite;
    }
    @keyframes fall { to { transform: translateY(110vh); } }

    /* ── Snow ── */
    .snow-container {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; overflow: hidden; opacity: 0; transition: opacity 1s;
    }
    .snow-container.visible { opacity: 1; }
    .snowflake {
      position: absolute; top: -10px; color: rgba(255,255,255,0.55);
      animation: snowfall linear infinite;
    }
    @keyframes snowfall { to { transform: translateY(110vh) rotate(360deg); } }

    /* ── Card ── */
    .card {
      position: relative; z-index: 10;
      background: linear-gradient(165deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.03) 100%);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 34px 40px 30px;
      max-width: 640px; width: 100%;
      box-shadow: 0 30px 70px rgba(0,0,0,0.42), 0 0 0 1px rgba(255,255,255,0.04) inset;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    }

    /* top bar */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 22px;
    }
    .location-block { text-align: left; }
    .location {
      font-size: 10px; font-weight: 600; letter-spacing: 2.4px;
      text-transform: uppercase; color: var(--muted);
    }
    .city {
      font-family: "Sora", sans-serif;
      font-size: 24px; font-weight: 300; letter-spacing: -0.8px;
      color: var(--text); margin-top: 2px;
    }
    .location::before { content: "◎"; color: var(--accent); margin-right: 7px; font-size: 12px; }
    .update-time {
      font-size: 11px; color: var(--dim); letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px;
      background: rgba(255,255,255,0.045);
    }

    .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .eyebrow { font-size: 10px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--dim); }
    .live-status { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(180,235,205,0.8); }
    .live-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #7ee2a9; box-shadow: 0 0 12px #7ee2a9; }

    /* main temp */
    .main { text-align: center; margin-bottom: 28px; }
    .weather-icon {
      font-size: 70px; line-height: 1; margin-bottom: 8px;
      filter: drop-shadow(0 8px 32px rgba(0,0,0,0.3));
      animation: float 5s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .temp-row {
      display: flex; align-items: baseline; justify-content: center; gap: 2px;
    }
    .temp {
      font-family: "Sora", sans-serif;
      font-size: 108px; font-weight: 200; letter-spacing: -7px; line-height: 0.95;
      color: var(--text);
    }
    .temp-unit {
      font-size: 22px; font-weight: 300; color: var(--muted);
      margin-top: 4px; letter-spacing: 0;
    }
    .condition {
      font-size: 17px; font-weight: 300; color: var(--muted);
      margin-top: 9px; letter-spacing: 0.2px;
    }

    .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 24px 0; }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 26px; }
    .stat {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 15px 10px 14px;
      background: var(--glass);
      border-radius: 16px;
      border: 1px solid transparent;
      transition: all 0.3s cubic-bezier(.4,0,.2,1);
    }
    .stat:hover { background: var(--glass-hover); border-color: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .stat-icon { font-size: 16px; opacity: 0.7; }
    .stat-value { font-size: 16px; font-weight: 500; letter-spacing: -0.3px; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }

    /* ── Forecast ── */
    .forecast { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; }

    .forecast-day {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: var(--glass);
      border: 1px solid transparent;
      border-radius: 15px; padding: 15px 4px 13px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(.4,0,.2,1);
      user-select: none; outline: none;
    }
    .forecast-day:hover { background: var(--glass-hover); transform: translateY(-2px); }
    .forecast-day:focus-visible { box-shadow: 0 0 0 2px rgba(255,255,255,0.3); }
    .forecast-day.active {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.18);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .forecast-day-name { font-size: 10px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--dim); font-weight: 600; }
    .forecast-icon { font-size: 21px; line-height: 1; margin: 3px 0; }
    .forecast-hi { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .forecast-lo { font-size: 12px; color: var(--muted); }

    /* ── Detail panel ── */
    .detail-panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.5s cubic-bezier(.4,0,.2,1), opacity 0.35s ease, margin-top 0.35s ease;
      opacity: 0; margin-top: 0;
    }
    .detail-panel.open { max-height: 900px; opacity: 1; margin-top: 20px; }

    .detail-inner {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 22px;
      padding: 24px 24px 20px;
    }

    .detail-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .detail-date { font-family: "Sora", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
    .detail-condition { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 400; }

    .detail-temps {
      display: flex; gap: 32px; margin-bottom: 20px; justify-content: center;
    }
    .detail-temp-block { text-align: center; }
    .detail-temp-val { font-family: "Sora", sans-serif; font-size: 48px; font-weight: 200; letter-spacing: -4px; line-height: 1; }
    .detail-temp-val sup { font-size: 20px; vertical-align: super; }
    .detail-temp-lbl { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); margin-top: 6px; }

    .detail-divider { height: 1px; background: rgba(255,255,255,0.06); margin-bottom: 18px; }

    .detail-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
    .detail-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .detail-stat-icon { font-size: 14px; opacity: 0.6; }
    .detail-stat-val { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .detail-stat-lbl { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); text-align: center; }

    /* ── Sparkline ── */
    .sparkline-wrap { margin-top: 20px; }
    .sparkline-label {
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim);
      margin-bottom: 10px; text-align: center;
    }
    .sparkline-svg { width: 100%; height: 48px; display: block; }

    /* ── Hourly ── */
    .hourly-scroll {
      display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 2px;
      margin-top: 14px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .hourly-scroll::-webkit-scrollbar { height: 3px; }
    .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    .hourly-scroll::-webkit-scrollbar-track { background: transparent; }
    .hourly-block {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      min-width: 46px; padding: 8px 5px 6px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.03);
      transition: background 0.2s;
    }
    .hourly-block:hover { background: rgba(255,255,255,0.08); }
    .hourly-time  { font-size: 9px; color: var(--dim); letter-spacing: 0.5px; font-weight: 500; }
    .hourly-icon  { font-size: 14px; line-height: 1; }
    .hourly-temp  { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .hourly-pop   { font-size: 9px; color: rgba(170,210,255,0.65); font-weight: 500; }

    .updated { margin-top: 22px; font-size: 10px; color: var(--dim); letter-spacing: 1.4px; text-align: center; text-transform: uppercase; }

    /* ── Loading / Error ── */
    .loading { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 48px 0; }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: rgba(255,180,180,0.8); font-size: 14px; margin-top: 8px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .rain-container, .snow-container, .stars { display: none; }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      body { padding: 20px 12px; }
      .card { padding: 28px 18px 24px; border-radius: 26px; }
      .temp { font-size: 78px; letter-spacing: -4px; }
      .weather-icon { font-size: 58px; }
      .city { font-size: 21px; }
      .update-time { padding: 7px 9px; font-size: 10px; }
      .stats { gap: 6px; }
      .stat { padding: 12px 6px; }
      .detail-temps { gap: 20px; }
      .detail-temp-val { font-size: 36px; }
      .forecast-day { padding: 10px 3px; }
    }
  </style>
</head>
<body>
  <div class="bg clear-day" id="bg"></div>
  <div class="glow clear-day" id="glow"></div>
  <div class="stars" id="stars"></div>
  <div class="rain-container" id="rain"></div>
  <div class="snow-container" id="snow"></div>

  <div class="card" id="card">
    <div class="loading">
      <div class="spinner"></div>
      <p>Fetching Tokyo weather…</p>
    </div>
  </div>

  <script>
    // Register service worker for PWA offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {/* sw optional */});
      });
    }

    const LAT = 35.6762, LON = 139.6503;

    const WMO = {
      0:  { label: "Clear Sky" },
      1:  { label: "Mainly Clear" },
      2:  { label: "Partly Cloudy",     icon: "⛅" },
      3:  { label: "Overcast",          icon: "☁️"  },
      45: { label: "Foggy",             icon: "🌫️" },
      48: { label: "Icy Fog",           icon: "🌫️" },
      51: { label: "Light Drizzle",     icon: "🌦️" },
      53: { label: "Drizzle",           icon: "🌧️" },
      55: { label: "Heavy Drizzle",     icon: "🌧️" },
      61: { label: "Light Rain",        icon: "🌧️" },
      63: { label: "Rain",              icon: "🌧️" },
      65: { label: "Heavy Rain",        icon: "🌧️" },
      66: { label: "Freezing Rain",     icon: "🌨️" },
      67: { label: "Heavy Freezing Rain",icon: "🌨️" },
      71: { label: "Light Snow",        icon: "🌨️" },
      73: { label: "Snow",              icon: "❄️"  },
      75: { label: "Heavy Snow",        icon: "❄️"  },
      77: { label: "Snow Grains",       icon: "🌨️" },
      80: { label: "Light Showers",     icon: "🌦️" },
      81: { label: "Showers",           icon: "🌧️" },
      82: { label: "Heavy Showers",     icon: "⛈️"  },
      85: { label: "Snow Showers",      icon: "🌨️" },
      86: { label: "Heavy Snow Showers",icon: "🌨️" },
      95: { label: "Thunderstorm",      icon: "⛈️"  },
      96: { label: "Thunderstorm + Hail",icon: "⛈️" },
      99: { label: "Thunderstorm + Hail",icon: "⛈️" },
    };

    const getIcon = (code, isDay) =>
      (code === 0 || code === 1) ? (isDay ? "☀️" : "🌙") : (WMO[code]?.icon ?? "🌡️");

    const getBgClass = (code, isDay) =>
      code >= 71 && code <= 77 ? "snowy" :
      code >= 51 && code <= 82 ? "rainy" :
      code >= 3                ? "cloudy" :
      isDay                    ? "clear-day" : "clear-night";

    function dayName(dateStr, i) {
      if (i === 0) return "Today";
      return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" });
    }

    function fullDate(dateStr) {
      return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", {
        weekday: "long", month: "long", day: "numeric"
      });
    }

    function buildStars() {
      const c = document.getElementById("stars");
      for (let i = 0; i < 80; i++) {
        const s = document.createElement("div");
        s.className = "star";
        const size = Math.random() * 2 + 0.5;
        s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${3+Math.random()*3}s;`;
        c.appendChild(s);
      }
    }

    function buildRain() {
      const c = document.getElementById("rain");
      for (let i = 0; i < 60; i++) {
        const d = document.createElement("div");
        d.className = "raindrop";
        d.style.cssText = `left:${Math.random()*100}%;animation-duration:${0.5+Math.random()*0.5}s;animation-delay:${Math.random()*1.5}s;`;
        c.appendChild(d);
      }
    }

    function buildSnow() {
      const c = document.getElementById("snow");
      for (let i = 0; i < 40; i++) {
        const f = document.createElement("div");
        f.className = "snowflake";
        f.textContent = ["❄","❅","❆","✦","✧"][Math.floor(Math.random()*5)];
        f.style.cssText = `left:${Math.random()*100}%;font-size:${8+Math.random()*10}px;animation-duration:${5+Math.random()*5}s;animation-delay:${Math.random()*5}s;`;
        c.appendChild(f);
      }
    }

    function setScene(bgClass) {
      document.getElementById("bg").className = `bg ${bgClass}`;
      document.getElementById("glow").className = `glow ${bgClass}`;
      document.getElementById("stars").classList.toggle("visible", bgClass === "clear-night");
      document.getElementById("rain").classList.toggle("visible",  bgClass === "rainy");
      document.getElementById("snow").classList.toggle("visible",  bgClass === "snowy");
    }

    async function fetchWeather() {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
        + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day`
        + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,`
        + `wind_speed_10m_max,uv_index_max,sunrise,sunset`
        + `&hourly=temperature_2m,weather_code,precipitation_probability`
        + `&timezone=Asia%2FTokyo&forecast_days=5`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    let activeIndex = null;
    let dailyData = null;
    let hourlyData = null;
    let refreshTimer = null;

    function toggleDetail(i) {
      const panel = document.getElementById("detail-panel");
      const days  = document.querySelectorAll(".forecast-day");
      const d     = dailyData;
      const h     = hourlyData;

      if (activeIndex === i) {
        panel.classList.remove("open");
        days[i].classList.remove("active");
        activeIndex = null;
        return;
      }

      days.forEach(d => d.classList.remove("active"));
      days[i].classList.add("active");
      activeIndex = i;

      const code = d.weather_code[i];
      const hi   = Math.round(d.temperature_2m_max[i]);
      const lo   = Math.round(d.temperature_2m_min[i]);
      const rain = d.precipitation_sum[i].toFixed(1);
      const wind = Math.round(d.wind_speed_10m_max[i]);
      const uv   = Math.round(d.uv_index_max[i]);
      const sunrise = new Date(d.sunrise[i]).toLocaleTimeString("en-US", {
        hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo"
      });
      const sunset = new Date(d.sunset[i]).toLocaleTimeString("en-US", {
        hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo"
      });

      // hourly strip data
      const dayStart = new Date(d.time[i] + "T00:00:00+09:00").getTime();
      const dayEnd   = new Date(d.time[i] + "T23:59:59+09:00").getTime();
      const hours = [];
      for (let j = 0; j < h.time.length; j++) {
        const t = new Date(h.time[j]).getTime();
        if (t >= dayStart && t <= dayEnd) {
          hours.push({
            time: new Date(t).toLocaleTimeString("en-US", { hour: "2-digit", hour12: false, timeZone: "Asia/Tokyo" }),
            temp: Math.round(h.temperature_2m[j]),
            code: h.weather_code[j],
            pop:  h.precipitation_probability[j]
          });
        }
      }

      // sparkline SVG path
      const temps = hours.map(x => x.temp);
      const minT = Math.min(...temps), maxT = Math.max(...temps);
      const range = maxT - minT || 1;
      const w = 100, h2 = 36;
      const points = temps.map((t, idx) => {
        const x = (idx / (temps.length - 1)) * w;
        const y = h2 - ((t - minT) / range) * h2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");

      const sparkSVG = `
        <svg class="sparkline-svg" viewBox="0 0 100 48" preserveAspectRatio="none">
          <defs>
            <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(240,192,96,0.3)"/>
              <stop offset="100%" stop-color="rgba(240,192,96,0)"/>
            </linearGradient>
          </defs>
          <polygon points="0,${h2} ${points} ${w},${h2}" fill="url(#sparkGrad)" />
          <polyline points="${points}" fill="none" stroke="#f0c060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      `;

      const hourlyHTML = hours.map(x => `
        <div class="hourly-block">
          <span class="hourly-time">${x.time}</span>
          <span class="hourly-icon">${getIcon(x.code, true)}</span>
          <span class="hourly-temp">${x.temp}°</span>
          ${x.pop > 0 ? `<span class="hourly-pop">${x.pop}%</span>` : ""}
        </div>
      `).join("");

      document.getElementById("detail-panel").innerHTML = `
        <div class="detail-inner">
          <div class="detail-header">
            <span class="detail-date">${fullDate(d.time[i])}</span>
            <span class="detail-condition">${getIcon(code, true)} ${WMO[code]?.label ?? "—"}</span>
          </div>
          <div class="detail-temps">
            <div class="detail-temp-block">
              <div class="detail-temp-val">${hi}<sup>°C</sup></div>
              <div class="detail-temp-lbl">High</div>
            </div>
            <div style="width:1px;background:rgba(255,255,255,0.08);margin:8px 0"></div>
            <div class="detail-temp-block">
              <div class="detail-temp-val">${lo}<sup>°C</sup></div>
              <div class="detail-temp-lbl">Low</div>
            </div>
          </div>
          <div class="detail-divider"></div>
          <div class="detail-stats">
            <div class="detail-stat">
              <span class="detail-stat-icon">🌧️</span>
              <span class="detail-stat-val">${rain} mm</span>
              <span class="detail-stat-lbl">Rain</span>
            </div>
            <div class="detail-stat">
              <span class="detail-stat-icon">💨</span>
              <span class="detail-stat-val">${wind} km/h</span>
              <span class="detail-stat-lbl">Max Wind</span>
            </div>
            <div class="detail-stat">
              <span class="detail-stat-icon">☀️</span>
              <span class="detail-stat-val">${uv}</span>
              <span class="detail-stat-lbl">UV Index</span>
            </div>
            <div class="detail-stat">
              <span class="detail-stat-icon">🌅</span>
              <span class="detail-stat-val">${sunrise}</span>
              <span class="detail-stat-lbl">Sunrise</span>
            </div>
          </div>
          <div class="sparkline-wrap">
            <div class="sparkline-label">24h Temperature</div>
            ${sparkSVG}
          </div>
          <div class="hourly-scroll" style="margin-top:14px">${hourlyHTML}</div>
        </div>
      `;

      document.getElementById("detail-panel").classList.add("open");
    }

    function render(data) {
      const c = data.current;
      const d = data.daily;
      dailyData = d;
      hourlyData = data.hourly;

      const code  = c.weather_code;
      const isDay = c.is_day === 1;
      const temp  = Math.round(c.temperature_2m);
      const icon  = getIcon(code, isDay);
      const label = WMO[code]?.label ?? "Unknown";

      setScene(getBgClass(code, isDay));

      // Update page title dynamically with current conditions
      document.title = `Tokyo Weather — ${temp}°C ${icon}`;

      // Update OG meta for any in-session link previews
      const ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.setAttribute("content", `Tokyo Weather — ${temp}°C ${label}`);

      const forecastHTML = d.time.map((date, i) => `
        <div class="forecast-day" onclick="toggleDetail(${i})" role="button" tabindex="0"
             aria-label="${dayName(date, i)} forecast" onkeydown="if(event.key==='Enter')toggleDetail(${i})">
          <span class="forecast-day-name">${dayName(date, i)}</span>
          <span class="forecast-icon">${getIcon(d.weather_code[i], true)}</span>
          <span class="forecast-hi">${Math.round(d.temperature_2m_max[i])}°</span>
          <span class="forecast-lo">${Math.round(d.temperature_2m_min[i])}°</span>
        </div>
      `).join("");

      const now = new Date().toLocaleTimeString("en-US", {
        hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo"
      });

      document.getElementById("card").innerHTML = `
        <div class="top-bar">
          <div class="location-block">
            <div class="location">Tokyo, Japan</div>
            <div class="city">東京</div>
          </div>
          <div class="update-time" id="update-time">${now} JST</div>
        </div>
        <div class="status-row">
          <span class="eyebrow">Live conditions</span>
          <span class="live-status">Updated just now</span>
        </div>
        <div class="main">
          <div class="weather-icon">${icon}</div>
          <div class="temp-row">
            <span class="temp">${temp}</span>
            <span class="temp-unit">°C</span>
          </div>
          <div class="condition">${label}</div>
        </div>
        <div class="divider"></div>
        <div class="stats">
          <div class="stat">
            <span class="stat-icon">🌡️</span>
            <span class="stat-value">${Math.round(c.apparent_temperature)}°</span>
            <span class="stat-label">Feels Like</span>
          </div>
          <div class="stat">
            <span class="stat-icon">💧</span>
            <span class="stat-value">${c.relative_humidity_2m}%</span>
            <span class="stat-label">Humidity</span>
          </div>
          <div class="stat">
            <span class="stat-icon">💨</span>
            <span class="stat-value">${Math.round(c.wind_speed_10m)} <small style="font-size:10px;font-weight:400;opacity:0.7">km/h</small></span>
            <span class="stat-label">Wind</span>
          </div>
        </div>
        <div class="divider"></div>
        <div class="forecast">${forecastHTML}</div>
        <div class="detail-panel" id="detail-panel"></div>
        <div class="updated">Tap a day for details</div>
      `;
    }

    function renderError(msg) {
      document.getElementById("card").innerHTML = `
        <div class="loading">
          <div style="font-size:36px;opacity:0.5">⚠️</div>
          <p>Could not load weather data</p>
          <p class="error-msg">${msg}</p>
          <button onclick="init()" style="margin-top:12px;padding:12px 28px;border:none;background:rgba(255,255,255,0.1);color:#fff;border-radius:24px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:500;letter-spacing:0.5px;transition:background 0.2s;">Retry</button>
        </div>
      `;
    }

    function startAutoRefresh() {
      clearInterval(refreshTimer);
      refreshTimer = setInterval(fetchWeather, 60 * 60 * 1000);
    }

    async function init() {
      buildStars(); buildRain(); buildSnow();
      try {
        const data = await fetchWeather();
        render(data);
        startAutoRefresh();
      } catch (e) {
        renderError(e.message);
      }
    }

    init();
  </script>
</body>
</html>
