<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tokyo Weather</title>
  <meta name="description" content="Live weather conditions and 5-day forecast for Tokyo, Japan." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#080b14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600;700&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --glass: rgba(255,255,255,0.07);
      --glass-hover: rgba(255,255,255,0.13);
      --border: rgba(255,255,255,0.12);
      --text: #fbfbfd;
      --muted: rgba(228,232,244,0.68);
      --dim: rgba(220,225,240,0.42);
      --accent: #f5c66f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #080b14; color: var(--text); overflow-x: hidden; padding: 48px 20px;
    }
    .bg {
      position: fixed; inset: 0; z-index: 0; transition: background 2s ease;
    }
    .bg.clear-day { background: linear-gradient(160deg, #0c1e3d 0%, #163a6d 40%, #2a5a8a 70%, #c47a2a 100%); }
    .bg.clear-night { background: linear-gradient(160deg, #04060e 0%, #0a1228 50%, #121838 100%); }
    .bg.cloudy { background: linear-gradient(160deg, #10141e 0%, #1a2030 50%, #2a3448 100%); }
    .bg.rainy { background: linear-gradient(160deg, #080c18 0%, #101830 50%, #1a2850 100%); }
    .card {
      position: relative; z-index: 10;
      background: linear-gradient(165deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.03) 100%);
      backdrop-filter: blur(28px); border: 1px solid var(--border); border-radius: 32px;
      padding: 34px 40px 30px; max-width: 640px; width: 100%;
      box-shadow: 0 30px 70px rgba(0,0,0,0.42), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .location { font-size: 10px; font-weight: 600; letter-spacing: 2.4px; text-transform: uppercase; color: var(--muted); }
    .city { font-family: "Sora", sans-serif; font-size: 24px; font-weight: 300; letter-spacing: -0.8px; margin-top: 2px; }
    .update-time { font-size: 11px; color: var(--dim); padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,0.045); }
    .main { text-align: center; margin-bottom: 28px; }
    .weather-icon { font-size: 70px; line-height: 1; margin-bottom: 8px; display: inline-block; }
    .temp-row { display: flex; align-items: baseline; justify-content: center; gap: 2px; }
    .temp { font-family: "Sora", sans-serif; font-size: 108px; font-weight: 200; letter-spacing: -7px; line-height: 0.95; }
    .temp-unit { font-size: 22px; font-weight: 300; color: var(--muted); margin-top: 4px; }
    .condition { font-size: 17px; font-weight: 300; color: var(--muted); margin-top: 9px; }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 24px 0; }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 26px; }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 15px 10px 14px; background: var(--glass); border-radius: 16px; transition: all 0.3s; }
    .stat:hover { background: var(--glass-hover); transform: translateY(-1px); }
    .stat-icon { font-size: 16px; opacity: 0.7; }
    .stat-value { font-size: 16px; font-weight: 500; }
    .stat-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }
    .forecast { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; }
    .forecast-day { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--glass); border-radius: 15px; padding: 15px 4px 13px; cursor: pointer; transition: all 0.25s; }
    .forecast-day:hover { background: var(--glass-hover); transform: translateY(-2px); }
    .forecast-day-name { font-size: 10px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--dim); font-weight: 600; }
    .forecast-icon { font-size: 21px; line-height: 1; margin: 3px 0; }
    .forecast-hi { font-size: 14px; font-weight: 500; }
    .forecast-lo { font-size: 12px; color: var(--muted); }
    .loading { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 48px 0; }
    .spinner { width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.08); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: rgba(255,180,180,0.8); font-size: 14px; margin-top: 8px; }
    @media (max-width: 480px) {
      body { padding: 20px 12px; }
      .card { padding: 28px 18px 24px; border-radius: 26px; }
      .temp { font-size: 78px; letter-spacing: -4px; }
      .weather-icon { font-size: 58px; }
    }
  </style>
</head>
<body>
  <div class="bg clear-day" id="bg"></div>

  <div class="card" id="card">
    <div class="loading">
      <div class="spinner"></div>
      <p>Fetching Tokyo weather…</p>
    </div>
  </div>

  <script>
    const LAT = 35.6762, LON = 139.6503;

    const WMO = {
      0: { label: "Clear Sky" }, 1: { label: "Mainly Clear" }, 2: { label: "Partly Cloudy", icon: "⛅" },
      3: { label: "Overcast", icon: "☁️" }, 61: { label: "Light Rain", icon: "🌧️" },
      63: { label: "Rain", icon: "🌧️" }, 65: { label: "Heavy Rain", icon: "🌧️" }
    };

    const getIcon = (code, isDay) =>
      (code === 0 || code === 1) ? (isDay ? "☀️" : "🌙") : (WMO[code]?.icon ?? "🌡️");

    const getBgClass = (code, isDay) =>
      code >= 61 ? "rainy" : code >= 3 ? "cloudy" : isDay ? "clear-day" : "clear-night";

    function dayName(dateStr, i) {
      return i === 0 ? "Today" : new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" });
    }

    async function fetchWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=5`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      } catch (error) {
        console.error('Weather fetch error:', error);
        throw error;
      }
    }

    function render(data) {
      const c = data.current;
      const d = data.daily;
      const code = c.weather_code;
      const isDay = c.is_day === 1;
      const temp = Math.round(c.temperature_2m);
      const icon = getIcon(code, isDay);

      document.getElementById("bg").className = `bg ${getBgClass(code, isDay)}`;
      document.title = `Tokyo Weather — ${temp}°C ${icon}`;

      const forecastHTML = d.time.map((date, i) => `
        <div class="forecast-day">
          <span class="forecast-day-name">${dayName(date, i)}</span>
          <span class="forecast-icon">${getIcon(d.weather_code[i], true)}</span>
          <span class="forecast-hi">${Math.round(d.temperature_2m_max[i])}°</span>
          <span class="forecast-lo">${Math.round(d.temperature_2m_min[i])}°</span>
        </div>
      `).join("");

      const now = new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo" });

      document.getElementById("card").innerHTML = `
        <div class="top-bar">
          <div>
            <div class="location">Tokyo, Japan</div>
            <div class="city">東京</div>
          </div>
          <div class="update-time">${now} JST</div>
        </div>
        <div class="main">
          <div class="weather-icon">${icon}</div>
          <div class="temp-row">
            <span class="temp">${temp}</span>
            <span class="temp-unit">°C</span>
          </div>
          <div class="condition">${WMO[code]?.label ?? "Weather"}</div>
        </div>
        <div class="divider"></div>
        <div class="stats">
          <div class="stat">
            <span class="stat-icon">🌡️</span>
            <span class="stat-value">${Math.round(c.apparent_temperature)}°</span>
            <span class="stat-label">Feels Like</span>
          </div>
          <div class="stat">
            <span class="stat-icon">💧</span>
            <span class="stat-value">${c.relative_humidity_2m}%</span>
            <span class="stat-label">Humidity</span>
          </div>
          <div class="stat">
            <span class="stat-icon">💨</span>
            <span class="stat-value">${Math.round(c.wind_speed_10m)} km/h</span>
            <span class="stat-label">Wind</span>
          </div>
        </div>
        <div class="divider"></div>
        <div class="forecast">${forecastHTML}</div>
      `;
    }

    function renderError(msg) {
      document.getElementById("card").innerHTML = `
        <div class="loading">
          <div style="font-size:36px;opacity:0.5">⚠️</div>
          <p>Could not load weather data</p>
          <p class="error-msg">${msg}</p>
          <button onclick="init()" style="margin-top:12px;padding:12px 28px;border:none;background:rgba(255,255,255,0.1);color:#fff;border-radius:24px;cursor:pointer;">Retry</button>
        </div>
      `;
    }

    async function init() {
      try {
        const data = await fetchWeather();
        render(data);
      } catch (e) {
        renderError(e.message);
      }
    }

    init();
  </script>
</body>
</html>
