<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo Weather</title>
  <style>
    body { font-family: system-ui; margin: 0; padding: 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); }
    .loading { text-align: center; }
    .weather { text-align: center; }
    .temp { font-size: 4rem; margin: 20px 0; }
    .condition { font-size: 1.5rem; margin-bottom: 20px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
    .stat { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; text-align: center; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tokyo Weather 🌤️</h1>
    <div id="content">
      <div class="loading">Loading weather data...</div>
    </div>
  </div>

  <script>
    async function getWeather() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.6762&longitude=139.6503&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=Asia/Tokyo');

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const current = data.current;

        const weatherCodes = {
          0: '☀️ Clear',
          1: '🌤️ Mainly Clear',
          2: '⛅ Partly Cloudy',
          3: '☁️ Overcast',
          61: '🌧️ Light Rain',
          63: '🌧️ Rain',
          65: '🌧️ Heavy Rain'
        };

        document.getElementById('content').innerHTML = `
          <div class="weather">
            <div class="temp">${Math.round(current.temperature_2m)}°C</div>
            <div class="condition">${weatherCodes[current.weather_code] || '🌡️ Weather'}</div>
            <div class="stats">
              <div class="stat">
                <div>💧 Humidity</div>
                <div>${current.relative_humidity_2m}%</div>
              </div>
              <div class="stat">
                <div>💨 Wind</div>
                <div>${Math.round(current.wind_speed_10m)} km/h</div>
              </div>
              <div class="stat">
                <div>📍 Location</div>
                <div>Tokyo</div>
              </div>
            </div>
            <p style="margin-top: 30px; opacity: 0.7;">Updated: ${new Date().toLocaleTimeString()}</p>
          </div>
        `;

      } catch (error) {
        document.getElementById('content').innerHTML = `
          <div class="error">
            <h3>⚠️ Error loading weather</h3>
            <p>${error.message}</p>
            <button onclick="getWeather()" style="padding: 10px 20px; margin-top: 15px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">Retry</button>
          </div>
        `;
      }
    }

    getWeather();
  </script>
</body>
</html>
